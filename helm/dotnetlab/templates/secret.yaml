{{/*
Secret de la aplicación.

Solo se crea si secrets.create es true Y no se ha indicado un Secret existente. En producción
lo normal es lo contrario: secrets.create=false y secrets.existingSecret apuntando a un Secret
creado por el pipeline, por SOPS/Sealed Secrets o sincronizado desde Key Vault con el CSI
driver. Un valor que llega por --set queda registrado en el historial de la release y lo puede
leer cualquiera con permiso de `helm get values`.
*/}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dotnetlab.fullname" . }}-secrets
  labels:
    {{- include "dotnetlab.labels" . | nindent 4 }}
type: Opaque
{{/* stringData en vez de data: el servidor codifica en base64 al guardarlo, así se evita el
     error clásico de pegar un base64 con un salto de línea de más. */}}
stringData:
  shared-key: {{ required "secrets.sharedKey es obligatorio cuando secrets.create=true" .Values.secrets.sharedKey | quote }}
  rabbitmq-password: {{ required "secrets.rabbitmqPassword es obligatorio cuando secrets.create=true" .Values.secrets.rabbitmqPassword | quote }}
{{- end }}
