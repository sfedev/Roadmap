# =============================================================================
# Secretos de la aplicación.
#
# AVISO IMPORTANTE: un Secret de Kubernetes NO está cifrado por defecto, solo codificado en
# base64 dentro de etcd. Este fichero existe para poder desplegar en local (Kind/Minikube) y
# como plantilla; NO debe contener valores reales ni versionarse con ellos.
#
# En producción hay tres caminos, de menos a más recomendable:
#   1. Habilitar el cifrado en reposo de etcd (EncryptionConfiguration) — mínimo imprescindible.
#   2. Sealed Secrets o SOPS: el fichero cifrado SÍ puede vivir en git.
#   3. Secrets Store CSI Driver con Azure Key Vault: el secreto nunca llega a etcd; el driver
#      lo monta como fichero en el pod y lo rota sin redesplegar. Es lo que aprovisiona el
#      Bicep de /infrastructure y la opción por defecto en AKS.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: dotnetlab-secrets
  namespace: dotnetlab
  labels:
    app.kubernetes.io/part-of: dotnetlab
# Opaque: pares clave/valor arbitrarios (frente a los tipos especializados como
# kubernetes.io/tls o kubernetes.io/dockerconfigjson).
type: Opaque
# stringData en vez de data: se escribe en claro y el servidor lo codifica en base64 al
# guardarlo. Es más legible y evita el error clásico de pegar un base64 con un salto de línea
# de más, que produce un secreto silenciosamente incorrecto.
stringData:
  # Clave compartida entre el frontend y la API. Genérala con:
  #   kubectl -n dotnetlab create secret generic dotnetlab-secrets \
  #     --from-literal=shared-key="$(openssl rand -base64 32)" \
  #     --from-literal=rabbitmq-password="$(openssl rand -base64 24)"
  shared-key: "CAMBIAME-clave-compartida-de-desarrollo"
  # Contraseña del usuario de RabbitMQ. La consumen la API, el frontend y el Worker.
  rabbitmq-password: "CAMBIAME-password-de-desarrollo"
